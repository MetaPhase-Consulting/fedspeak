# Policy: one consolidated version-update PR per month covering every npm
# dependency in both manifests (patch, minor, and major). Security updates
# are the only exception: Dependabot opens those individually and immediately
# when an advisory is published, regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /cli-package
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    groups:
      monthly-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor, major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    target-branch: dev
    commit-message:
      prefix: "chore(ci)"
    groups:
      monthly-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor, major]
